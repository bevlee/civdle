name: Deploy

# Push a release tag (git tag v0.1.0 && git push origin v0.1.0) to test,
# build, push the image to Docker Hub and roll it out to OKE. Can also be
# re-run by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      # Read by the OCI CLI that the OKE kubeconfig execs for auth tokens.
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ap-sydney-1
      SKAFFOLD_VERSION: v2.25.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Test
        run: |
          npm ci
          npm test

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: oracle-actions/configure-kubectl-oke@v1.5.0
        with:
          cluster: ${{ secrets.OKE_CLUSTER_OCID }}

      - name: Install Skaffold
        run: |
          curl -fsSLo skaffold "https://storage.googleapis.com/skaffold/releases/${SKAFFOLD_VERSION}/skaffold-linux-amd64"
          sudo install skaffold /usr/local/bin/
          rm skaffold

      - name: Build, push and deploy
        # Tag runs use the git tag; manual runs fall back to the commit SHA.
        run: skaffold run --tag="${{ github.ref_type == 'tag' && github.ref_name || github.sha }}"

      - name: Wait for rollout
        run: kubectl -n civdle rollout status deployment/civdle --timeout=5m
