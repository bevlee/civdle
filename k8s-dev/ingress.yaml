apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civdle-ingress
  namespace: civdle-dev
  labels:
    app: civdle
  annotations:
    # <namespace>-<name>@kubernetescrd, see middleware.yaml.
    traefik.ingress.kubernetes.io/router.middlewares: civdle-dev-compress@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - civdle-dev.bevsoft.com
      secretName: bevsoft-wildcard-tls
  rules:
    # Vite's HMR websocket shares this host and port, which Traefik proxies as-is.
    - host: civdle-dev.bevsoft.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: civdle
                port:
                  number: 80
