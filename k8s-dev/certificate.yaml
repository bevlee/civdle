# Single-host cert: letsencrypt-prod only has an http01 solver (see k8s/certificate.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: civdle
  namespace: civdle-dev
spec:
  commonName: civdle-dev.bevsoft.com
  dnsNames:
    - civdle-dev.bevsoft.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: civdle-tls
