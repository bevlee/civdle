apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: civdle
build:
  # `git describe --tags`: v0.2.0 on a tagged commit, v0.2.0-3-gabc1234 three
  # commits later, with -dirty for uncommitted changes. CI passes the release
  # tag explicitly via --tag.
  tagPolicy:
    gitCommit:
      variant: Tags
  artifacts:
    - image: docker.io/bevdev1/civdle
      docker:
        dockerfile: Dockerfile
deploy:
  kubectl:
    defaultNamespace: civdle
manifests:
  kustomize:
    paths:
      - k8s
